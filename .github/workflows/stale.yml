name: Stale

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days and is being marked as stale.
            If it is still relevant, please leave a comment or remove the `stale` label.
            It will be closed in 14 days if no further activity occurs.
          stale-pr-message: >
            This pull request has been inactive for 30 days and is being marked as stale.
            If it is still in progress, please leave a comment or remove the `stale` label.
            It will be closed in 14 days if no further activity occurs.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if this is still relevant.
          close-pr-message: >
            Closing due to inactivity. Feel free to reopen or submit a new PR if needed.
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security,in-progress'
          operations-per-run: 100
