name: Nightly Build

on:
  schedule:
    - cron: '0 4 * * *'  # daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Nightly Build & Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Run checks
        run: ./gradlew check --no-daemon

      - name: Build server JAR
        run: ./gradlew jar --no-daemon

      - name: Smoke test — server starts and responds
        run: |
          java -jar build/libs/attractor-server-devel.jar &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:7070/ > /dev/null 2>&1; then
              echo "Server is up"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond within 15 seconds"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ github.run_id }}
          path: build/reports/tests/
          retention-days: 3

  scan-image:
    name: Scan Docker Image for CVEs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.base
          push: false
          load: true
          tags: attractor-base:scan

      - name: Build app image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: attractor:scan
          build-args: |
            ATTRACTOR_IMAGE_VERSION=nightly

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: attractor:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker
